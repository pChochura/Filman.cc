services:
  tiwi-web:
    build:
      context: .
      args:
        - TMDB_API_KEY=${TMDB_API_KEY:-}
        - STREAM_API_BASE_URL=${STREAM_API_BASE_URL:-}
    container_name: tiwi-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file: .env
    networks:
      - app_default
      - dokploy-network

networks:
  app_default:
    external: true
  dokploy-network:
    external: true
